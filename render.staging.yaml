services:
  - type: web
    name: ai-bridge-browser-staging
    runtime: python
    plan: free
    region: oregon
    buildCommand: python --version
    startCommand: python -c "from server.http_server import serve; import os; serve(host='0.0.0.0', port=int(os.environ.get('PORT','10000')))"
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: MESSENGER_TOKEN_AI_A
        sync: false
      - key: MESSENGER_TOKEN_AI_B
        sync: false
      - key: MESSENGER_AI_ID_A
        value: AI-USER
      - key: MESSENGER_AI_ID_B
        value: AI-PEER
      - key: MESSENGER_ENVIRONMENT
        value: staging
      - key: MESSENGER_ALLOW_EPHEMERAL_STAGING
        value: 'true'
      - key: MESSENGER_STORAGE_MODE
        value: ephemeral
      - key: MESSENGER_DB_PATH
        value: ':memory:'
      - key: MESSENGER_AI_PROVIDER_MAP
        value: '{"AI-USER":"openai","AI-PEER":"anthropic"}'
      - key: AI_PROVIDER_HOST_HMAC_KEY_HEX
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_CALLS_ENABLED
        value: 'false'
      - key: ANTHROPIC_API_CALLS_ENABLED
        value: 'false'
