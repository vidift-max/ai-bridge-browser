name: Mission 35 Guest Transport Contract Hardening
on:
  push:
    branches: [feat/mission-35-transport-contract-hardening]
    paths:
      - 'server/messenger_backend.py'
      - 'server/test_messenger_backend.py'
      - 'web/guest-room.js'
      - 'web/guest-room.test.mjs'
      - 'docs/MISSION_35_GUEST_TRANSPORT_CONTRACT_HARDENING.md'
      - '.github/workflows/mission-35-guest-transport-contract-hardening.yml'
  pull_request:
    paths:
      - 'server/messenger_backend.py'
      - 'server/test_messenger_backend.py'
      - 'web/guest-room.js'
      - 'web/guest-room.test.mjs'
      - 'docs/MISSION_35_GUEST_TRANSPORT_CONTRACT_HARDENING.md'
      - '.github/workflows/mission-35-guest-transport-contract-hardening.yml'
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/guest-room.test.mjs
      - run: node --test web/*.test.mjs
  backend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s server -p 'test_*.py' -v
  android-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - run: gradle :app:testDebugUnitTest
      - run: gradle :app:assembleDebug
