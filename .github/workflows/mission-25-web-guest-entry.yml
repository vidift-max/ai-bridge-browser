name: Mission 25 Web Guest Entry Contract
on:
  push:
    branches: [feat/mission-25-web-guest-entry-contract]
    paths:
      - 'web/guest-join-contract.js'
      - 'web/guest-join-contract.test.mjs'
      - 'docs/MISSION_25_WEB_GUEST_ENTRY.md'
      - '.github/workflows/mission-25-web-guest-entry.yml'
  pull_request:
    paths:
      - 'web/guest-join-contract.js'
      - 'web/guest-join-contract.test.mjs'
      - 'docs/MISSION_25_WEB_GUEST_ENTRY.md'
      - '.github/workflows/mission-25-web-guest-entry.yml'
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete browser test suite
        run: node --test web/*.test.mjs
  backend-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete backend test suite
        run: python -m unittest discover -s server -p 'test_*.py' -v
  android-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
