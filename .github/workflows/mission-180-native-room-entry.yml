name: Mission 180 Native Room Entry and HTTPS Invites

on:
  push:
    branches:
      - fix/mission-180-native-room-entry
  pull_request:
    branches:
      - feat/mission-179-two-agent-roundtrip-proof
    paths:
      - "app/src/main/java/com/vidiftmax/aibridgebrowser/MainActivity.java"
      - "app/src/main/java/com/vidiftmax/aibridgebrowser/MessengerActivity.java"
      - "app/src/main/java/com/vidiftmax/aibridgebrowser/MessengerRemoteConfig.java"
      - "app/src/main/java/com/vidiftmax/aibridgebrowser/FirebaseMessengerClient.java"
      - "app/src/test/java/com/vidiftmax/aibridgebrowser/MessengerRemoteConfigTest.java"
      - ".github/workflows/mission-180-native-room-entry.yml"

permissions:
  contents: read

jobs:
  android-tests-and-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Firebase emulator test tooling
        run: npm install --no-save --no-package-lock firebase-tools@14.7.0 firebase@11.6.0 @firebase/rules-unit-testing@4.0.1
      - name: Run Firebase Realtime Database security rules tests
        run: npx firebase --config firebase/firebase.json emulators:exec --only database --project demo-ai-bridge-rules "node tests/firebase/database.rules.test.mjs"
      - name: Run Firebase rules parity regressions
        run: python -m unittest server.test_firebase_rules server.test_firebase_rules_parity -v
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
