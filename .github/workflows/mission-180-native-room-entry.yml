name: Mission 180 Native Room Entry and HTTPS Invites

on:
  push:
    branches:
      - fix/mission-180-native-room-entry

permissions:
  contents: read

jobs:
  android-tests-and-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Firebase emulator test tooling
        run: npm install --no-save --no-package-lock firebase-tools@14.7.0 firebase@11.6.0 @firebase/rules-unit-testing@4.0.1
      - name: Run Firebase Realtime Database security rules tests
        run: npx firebase --config firebase/firebase.json emulators:exec --only database --project demo-ai-bridge-rules "node tests/firebase/database.rules.test.mjs"
      - name: Run Firebase rules parity regressions
        run: python -m unittest server.test_firebase_rules server.test_firebase_rules_parity -v
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-mission-180-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
