name: Mission 22 Safe Local Model Selection
on:
  push:
    branches: [feat/mission-22-safe-local-model-selection]
    paths:
      - 'web/local-ai-model-catalog.js'
      - 'web/local-ai-model-catalog.test.mjs'
      - 'docs/MISSION_22_SAFE_LOCAL_MODEL_SELECTION.md'
      - '.github/workflows/mission-22-safe-local-model-selection.yml'
  pull_request:
    branches: [feat/mission-21-device-capability-assessment]
    paths:
      - 'web/local-ai-model-catalog.js'
      - 'web/local-ai-model-catalog.test.mjs'
      - 'docs/MISSION_22_SAFE_LOCAL_MODEL_SELECTION.md'
      - '.github/workflows/mission-22-safe-local-model-selection.yml'
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete browser test suite
        run: node --test web/*.test.mjs
  backend-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete backend test suite
        run: python -m unittest discover -s server -p 'test_*.py' -v
  android-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
