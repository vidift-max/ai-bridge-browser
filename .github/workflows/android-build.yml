name: Android Build

on:
  push:
    branches:
      - "feat/mission-90-staging-invite-activation"
      - "v2-saas-alpha"
      - "feat/mission-08-identity-validation"
      - "feat/mission-09-room-voice-controls"
      - "feat/mission-10-webrtc-private-calls-v2"
      - "feat/mission-136-android-browser-apk-readiness"
      - "feat/mission-195-android-ci-gate"
      - "feat/mission-196-session-isolation-gate"
      - "feat/mission-197-android-acceptance-readiness"
      - "feat/mission-198-ci-and-android-onboarding"
      - "feat/mission-199-in-app-updates"
      - "feat/mission-201-updater-progress"
      - "feat/mission-202-updater-state-guard"
      - "feat/mission-203-updater-lifecycle"
      - "feat/mission-204-atomic-apk-download"
      - "feat/mission-205-install-data-safety"
      - "feat/mission-210-ai01-ai02-update-ready"
      - "feat/mission-211-release-manifest-gate"
  pull_request:
    branches:
      - "feat/mission-90-staging-invite-activation"
      - "v2-saas-alpha"
      - "feat/mission-08-identity-validation"
      - "feat/mission-09-room-voice-controls"
      - "feat/mission-10-webrtc-private-calls-v2"
      - "feat/mission-135-gpt6-main-rooms-integration"
      - "feat/mission-136-android-browser-apk-readiness"
      - "feat/mission-193-two-account-boundary"
      - "feat/mission-194-profile-restore-guard"
      - "feat/mission-195-android-ci-gate"
      - "feat/mission-196-session-isolation-gate"
      - "feat/mission-197-android-acceptance-readiness"
      - "feat/mission-198-ci-and-android-onboarding"
      - "feat/mission-199-in-app-updates"
      - "feat/mission-201-updater-progress"
      - "feat/mission-202-updater-state-guard"
      - "feat/mission-203-updater-lifecycle"
      - "feat/mission-204-atomic-apk-download"
      - "feat/mission-205-install-data-safety"
      - "feat/mission-210-ai01-ai02-update-ready"
      - "feat/mission-211-release-manifest-gate"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release-preparation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build release preparation variant
        run: gradle :app:assembleRelease
      - name: Report release preparation state
        run: echo "RELEASE_SIGNING_STATUS=PREPARATION_ONLY"
      - name: Upload release preparation APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-release-preparation
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release-final:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Require release signing secrets
        env:
          AI_PHONE_RELEASE_KEYSTORE_B64: ${{ secrets.AI_PHONE_RELEASE_KEYSTORE_B64 }}
          AI_PHONE_RELEASE_STORE_PASSWORD: ${{ secrets.AI_PHONE_RELEASE_STORE_PASSWORD }}
          AI_PHONE_RELEASE_KEY_ALIAS: ${{ secrets.AI_PHONE_RELEASE_KEY_ALIAS }}
          AI_PHONE_RELEASE_KEY_PASSWORD: ${{ secrets.AI_PHONE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in AI_PHONE_RELEASE_KEYSTORE_B64 AI_PHONE_RELEASE_STORE_PASSWORD AI_PHONE_RELEASE_KEY_ALIAS AI_PHONE_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required release secret: $name"
              exit 1
            fi
          done
      - name: Check repository for signing material
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(.*\.(keystore|jks)|ai-phone-release-keystore\.b64)$'; then
            echo "Signing material must not be tracked in git."
            exit 1
          fi
      - name: Decode protected keystore
        env:
          AI_PHONE_RELEASE_KEYSTORE_B64: ${{ secrets.AI_PHONE_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$AI_PHONE_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ai-phone-release.keystore"
          test -s "$RUNNER_TEMP/ai-phone-release.keystore"
      - name: Build signed release APK
        env:
          AI_PHONE_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/ai-phone-release.keystore
          AI_PHONE_RELEASE_STORE_PASSWORD: ${{ secrets.AI_PHONE_RELEASE_STORE_PASSWORD }}
          AI_PHONE_RELEASE_KEY_ALIAS: ${{ secrets.AI_PHONE_RELEASE_KEY_ALIAS }}
          AI_PHONE_RELEASE_KEY_PASSWORD: ${{ secrets.AI_PHONE_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Verify APK signature and identity
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee app-release-signature.txt
          sha256sum "$APK" | tee app-release.apk.sha256
      - name: Generate strict in-app update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\\n' "$BADGING" | grep -m1 "^package:")"
          PACKAGE_NAME="$(printf '%s\\n' "$PACKAGE_LINE" | sed -n "s/.*name='\\([^']*\\)'.*/\\1/p")"
          VERSION_CODE="$(printf '%s\\n' "$PACKAGE_LINE" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")"
          VERSION_NAME="$(printf '%s\\n' "$PACKAGE_LINE" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")"
          test "$PACKAGE_NAME" = "com.vidiftmax.aibridgebrowser"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          python3 - "$PACKAGE_NAME" "$VERSION_CODE" "$VERSION_NAME" "$SHA256" <<'PY'
          import json, re, sys
          package, version_code, version_name, sha256 = sys.argv[1:]
          if not version_code.isdigit() or int(version_code) < 1:
              raise SystemExit("Invalid Android versionCode")
          if not version_name.strip() or not re.fullmatch(r"[a-f0-9]{64}", sha256):
              raise SystemExit("Invalid versionName or APK SHA-256")
          manifest = {
              "packageName": package,
              "versionCode": int(version_code),
              "versionName": version_name,
              "apkAssetName": "app-release.apk",
              "sha256": sha256,
              "notes": "AI Bridge Browser — versão oficial assinada."
          }
          with open("ai-bridge-update.json", "w", encoding="utf-8") as output:
              json.dump(manifest, output, ensure_ascii=False, indent=2)
              output.write("\\n")
          with open("ai-bridge-update.json", encoding="utf-8") as source:
              loaded = json.load(source)
          assert loaded["packageName"] == "com.vidiftmax.aibridgebrowser"
          assert loaded["apkAssetName"] == "app-release.apk"
          assert re.fullmatch(r"[a-f0-9]{64}", loaded["sha256"])
          print("UPDATE_MANIFEST_VALID=true")
          PY
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload updater manifest
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-release-update-manifest
          path: ai-bridge-update.json
          if-no-files-found: error
      - name: Upload release verification record
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-release-verification
          path: |
            app-release.apk.sha256
            app-release-signature.txt
          if-no-files-found: error
