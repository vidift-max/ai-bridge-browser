name: Android Build

on:
  push:
    branches: [ "v2-saas-alpha" ]
  pull_request:
    branches: [ "v2-saas-alpha" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release-preparation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build release variant
        env:
          AI_PHONE_RELEASE_KEYSTORE_PATH: ${{ secrets.AI_PHONE_RELEASE_KEYSTORE_PATH }}
          AI_PHONE_RELEASE_STORE_PASSWORD: ${{ secrets.AI_PHONE_RELEASE_STORE_PASSWORD }}
          AI_PHONE_RELEASE_KEY_ALIAS: ${{ secrets.AI_PHONE_RELEASE_KEY_ALIAS }}
          AI_PHONE_RELEASE_KEY_PASSWORD: ${{ secrets.AI_PHONE_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$AI_PHONE_RELEASE_KEYSTORE_PATH" ] && [ -n "$AI_PHONE_RELEASE_STORE_PASSWORD" ] && [ -n "$AI_PHONE_RELEASE_KEY_ALIAS" ] && [ -n "$AI_PHONE_RELEASE_KEY_PASSWORD" ]; then
            echo "Release signing credentials detected."
          else
            echo "Release signing credentials are not configured; building unsigned release preparation APK."
          fi
          gradle :app:assembleRelease
      - name: Report signing state
        env:
          AI_PHONE_RELEASE_KEYSTORE_PATH: ${{ secrets.AI_PHONE_RELEASE_KEYSTORE_PATH }}
          AI_PHONE_RELEASE_STORE_PASSWORD: ${{ secrets.AI_PHONE_RELEASE_STORE_PASSWORD }}
          AI_PHONE_RELEASE_KEY_ALIAS: ${{ secrets.AI_PHONE_RELEASE_KEY_ALIAS }}
          AI_PHONE_RELEASE_KEY_PASSWORD: ${{ secrets.AI_PHONE_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$AI_PHONE_RELEASE_KEYSTORE_PATH" ] && [ -n "$AI_PHONE_RELEASE_STORE_PASSWORD" ] && [ -n "$AI_PHONE_RELEASE_KEY_ALIAS" ] && [ -n "$AI_PHONE_RELEASE_KEY_PASSWORD" ]; then
            echo "RELEASE_SIGNING_STATUS=CONFIGURED"
          else
            echo "RELEASE_SIGNING_STATUS=NOT_CONFIGURED"
          fi
      - name: Upload release preparation APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-release-preparation
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
