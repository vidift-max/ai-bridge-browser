name: Android Build

on:
  push:
    branches: [ "v2-saas-alpha", "fix/**", "feat/tool-hub-cleanroom-agent-adapters" ]
  pull_request:
    branches: [ "v2-saas-alpha", "fix/browser-session-isolation-https-policy" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest
