name: Android Build

on:
  push:
    branches: [ "v2-saas-alpha", "feat/mission-295-m241-ai-first-contact-integration" ]
  pull_request:
    branches: [ "v2-saas-alpha" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest
      - name: Test update manifest generator
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Test ChatGPT DOM bridge contract
        run: node scripts/tests/test_chatgpt_dom_bridge.js
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Record debug APK identity and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE="$(printf '%s\\n' "$BADGING" | sed -nE "s/^package: name='([^']+)'.*/\\1/p" | head -n1)"
          VERSION_CODE="$(printf '%s\\n' "$BADGING" | sed -nE "s/^package:.* versionCode='([^']+)'.*/\\1/p" | head -n1)"
          VERSION_NAME="$(printf '%s\\n' "$BADGING" | sed -nE "s/^package:.* versionName='([^']+)'.*/\\1/p" | head -n1)"
          test "$PACKAGE" = "com.vidiftmax.aibridgebrowser"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          sha256sum "$APK" | tee ai-phone-debug.apk.sha256
          {
            echo "package=$PACKAGE"
            echo "versionCode=$VERSION_CODE"
            echo "versionName=$VERSION_NAME"
            echo "gitCommit=$GITHUB_SHA"
            echo "workflowRunId=$GITHUB_RUN_ID"
            echo "workflowRunAttempt=$GITHUB_RUN_ATTEMPT"
            echo "workflowRef=$GITHUB_REF"
            echo "buildType=debug"
            echo "distribution=temporary-github-actions-artifact"
          } | tee ai-phone-debug-build.txt
      - name: Upload debug APK and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-debug-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ai-phone-debug.apk.sha256
            ai-phone-debug-build.txt
          if-no-files-found: error
          retention-days: 7

  release-final:
    needs: debug-build
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/v2-saas-alpha' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Require release signing secrets
        env:
          AI_PHONE_RELEASE_KEYSTORE_B64: ${{ secrets.AI_PHONE_RELEASE_KEYSTORE_B64 }}
          AI_PHONE_RELEASE_STORE_PASSWORD: ${{ secrets.AI_PHONE_RELEASE_STORE_PASSWORD }}
          AI_PHONE_RELEASE_KEY_ALIAS: ${{ secrets.AI_PHONE_RELEASE_KEY_ALIAS }}
          AI_PHONE_RELEASE_KEY_PASSWORD: ${{ secrets.AI_PHONE_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.AI_PHONE_EXPECTED_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in AI_PHONE_RELEASE_KEYSTORE_B64 AI_PHONE_RELEASE_STORE_PASSWORD AI_PHONE_RELEASE_KEY_ALIAS AI_PHONE_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required release secret: $name"
              exit 1
            fi
          done
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "Missing AI_PHONE_EXPECTED_SIGNING_CERT_SHA256; release blocked until installed certificate is confirmed."
            exit 1
          fi
      - name: Check repository for signing material
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(.*\.(keystore|jks)|ai-phone-release-keystore\.b64)$'; then
            echo "Signing material must not be tracked in git."
            exit 1
          fi
      - name: Decode protected keystore
        env:
          AI_PHONE_RELEASE_KEYSTORE_B64: ${{ secrets.AI_PHONE_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$AI_PHONE_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ai-phone-release.keystore"
          test -s "$RUNNER_TEMP/ai-phone-release.keystore"
      - name: Build signed release APK
        env:
          AI_PHONE_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/ai-phone-release.keystore
          AI_PHONE_RELEASE_STORE_PASSWORD: ${{ secrets.AI_PHONE_RELEASE_STORE_PASSWORD }}
          AI_PHONE_RELEASE_KEY_ALIAS: ${{ secrets.AI_PHONE_RELEASE_KEY_ALIAS }}
          AI_PHONE_RELEASE_KEY_PASSWORD: ${{ secrets.AI_PHONE_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Verify APK signature and installed-certificate continuity
        env:
          EXPECTED_CERT_SHA256: ${{ vars.AI_PHONE_EXPECTED_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee app-release-signature.txt
          ACTUAL_CERT_SHA256="$(sed -nE 's/.*certificate SHA-256 digest: *([0-9A-Fa-f:]+).*/\1/p' app-release-signature.txt | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256_NORMALIZED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL_CERT_SHA256"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256_NORMALIZED" ]; then echo "Signing certificate mismatch; refusing to publish an incompatible update."; exit 1; fi
          sha256sum "$APK" | tee app-release.apk.sha256
      - name: Generate strict in-app update manifest
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          python3 scripts/create_android_update_manifest.py --apk "$APK" --aapt "$AAPT"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload updater manifest
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-release-update-manifest
          path: ai-bridge-update.json
          if-no-files-found: error
      - name: Upload release verification record
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-release-verification
          path: |
            app-release.apk.sha256
            app-release-signature.txt
          if-no-files-found: error
      - name: Publish official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(python3 -c 'import json; print(json.load(open("ai-bridge-update.json", encoding="utf-8"))["versionName"])')"
          VERSION_CODE="$(python3 -c 'import json; print(json.load(open("ai-bridge-update.json", encoding="utf-8"))["versionCode"])')"
          TAG="v${VERSION_NAME}-${VERSION_CODE}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists: $TAG"
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          AI Bridge Browser ${VERSION_NAME} (versionCode ${VERSION_CODE})

          Official signed Android APK for the AI-01 / AI-02 first-contact test.

          Package: com.vidiftmax.aibridgebrowser
          APK asset: app-release.apk
          SHA-256: $(cut -d ' ' -f 1 app-release.apk.sha256)

          The update manifest and APK signature verification record are attached.
          EOF
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            ai-bridge-update.json \
            app-release.apk.sha256 \
            app-release-signature.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AI Bridge Browser ${VERSION_NAME} (${VERSION_CODE})" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
