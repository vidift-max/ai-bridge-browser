name: Mission 160 Provider Audit Chain Integrity CI

on:
  push:
    branches:
      - feat/mission-160-provider-audit-chain-integrity
  pull_request:
    branches:
      - feat/mission-159-provider-lease-audit-trail
    paths:
      - "server/sqlite_store.py"
      - "server/test_provider_audit_chain_integrity.py"
      - "server/test_provider_lease_audit_trail.py"
      - "server/test_provider_request_store.py"
      - "server/test_provider_lease_multiprocess_recovery.py"
      - ".github/workflows/mission-160-provider-audit-chain-integrity.yml"
      - "docs/MISSION_160_PROVIDER_AUDIT_CHAIN_INTEGRITY.md"

jobs:
  provider-audit-chain-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_provider_audit_chain_integrity server.test_provider_lease_audit_trail server.test_provider_request_store server.test_provider_lease_multiprocess_recovery
