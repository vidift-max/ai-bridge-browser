name: Mission 168 Browser VM AbortController Regression

on:
  push:
    branches:
      - feat/mission-168-browser-test-abortcontroller-context
    paths:
      - "web/ai-conversation-loop.js"
      - "web/ai-conversation-loop.test.mjs"
      - ".github/workflows/mission-168-browser-vm-abortcontroller.yml"
      - "docs/MISSION_168_BROWSER_VM_ABORTCONTROLLER.md"
  pull_request:
    paths:
      - "web/ai-conversation-loop.js"
      - "web/ai-conversation-loop.test.mjs"
      - ".github/workflows/mission-168-browser-vm-abortcontroller.yml"
      - "docs/MISSION_168_BROWSER_VM_ABORTCONTROLLER.md"

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm runtime AbortController availability
        run: node -e "if (typeof AbortController !== 'function') process.exit(1); console.log(process.version)"
      - name: Run conversation controller tests
        run: node --test web/ai-conversation-loop.test.mjs
      - name: Run complete browser test suite
        run: node --test web/*.test.mjs
