name: Mission 172 Remote Anchor Conformance

on:
  push:
    branches:
      - feat/mission-172-remote-anchor-conformance
  pull_request:
    branches:
      - feat/mission-171-independent-anchor-contract
    paths:
      - "server/provider_audit_remote_anchor.py"
      - "server/provider_audit_durable_anchor.py"
      - "server/provider_audit_remote_service.py"
      - "server/test_provider_audit_remote_anchor.py"
      - "server/test_provider_audit_durable_anchor.py"
      - "server/test_provider_audit_remote_service.py"
      - "server/test_provider_audit_anchor_protocol.py"
      - "server/test_provider_audit_remote_anchor_conformance.py"
      - ".github/workflows/mission-172-remote-anchor-conformance.yml"
      - "docs/MISSION_172_REMOTE_ANCHOR_CONFORMANCE.md"

jobs:
  remote-anchor-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_provider_audit_remote_anchor_conformance server.test_provider_audit_anchor_protocol server.test_provider_audit_remote_anchor server.test_provider_audit_durable_anchor server.test_provider_audit_remote_service server.test_provider_audit_messenger_activation server.test_provider_audit_messenger_http_integration server.test_provider_audit_http_server_factory server.test_provider_audit_http_transport
