name: Mission 140 Rooms Conversation Runtime
on:
  pull_request:
    branches:
      - feat/mission-139-authenticated-ai-adapters
    paths:
      - "web/rooms.html"
      - "web/ai-conversation-panel.js"
      - "web/ai-conversation-panel.test.mjs"
      - "web/ai-conversation-runtime.js"
      - "web/ai-agent-adapter.js"
      - "web/ai-conversation-loop.js"
      - "server/http_server.py"
      - "server/test_http_server.py"
      - ".github/workflows/mission-140-rooms-conversation-runtime.yml"
      - "docs/MISSION_140_ROOMS_CONVERSATION_RUNTIME.md"
  push:
    branches:
      - feat/mission-140-rooms-conversation-runtime
jobs:
  node-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/ai-conversation-panel.test.mjs web/ai-agent-adapter.test.mjs web/ai-conversation-runtime.test.mjs web/ai-conversation-loop.test.mjs
  python-http-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest server.test_http_server
