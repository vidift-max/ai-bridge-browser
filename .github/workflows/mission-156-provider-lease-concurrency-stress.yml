name: Mission 156 Provider Lease Concurrency Stress CI

on:
  push:
    branches:
      - feat/mission-156-provider-lease-concurrency-stress
  pull_request:
    branches:
      - feat/mission-155-provider-lease-lifecycle
    paths:
      - "server/sqlite_store.py"
      - "server/test_provider_request_store.py"
      - "server/test_provider_host_messenger_http.py"
      - ".github/workflows/mission-156-provider-lease-concurrency-stress.yml"
      - "docs/MISSION_156_PROVIDER_LEASE_CONCURRENCY_STRESS.md"

jobs:
  provider-lease-concurrency-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_ai_provider_host server.test_provider_request_store server.test_provider_host_messenger_http server.test_ai_provider_host_contract_spec server.test_http_server server.test_messenger_backend server.test_agent_provider_registry
