name: Mission 173 Audit Chain Recovery Security

on:
  push:
    branches:
      - feat/mission-173-audit-chain-recovery-security
  pull_request:
    branches:
      - feat/mission-172-remote-anchor-conformance
    paths:
      - "server/provider_audit_durable_anchor.py"
      - "server/test_provider_audit_chain_recovery_security.py"
      - "server/test_provider_audit_durable_anchor.py"
      - "server/test_provider_audit_remote_anchor_conformance.py"
      - ".github/workflows/mission-173-audit-chain-recovery-security.yml"
      - "docs/MISSION_173_AUDIT_CHAIN_RECOVERY_SECURITY.md"

jobs:
  audit-chain-recovery-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_provider_audit_chain_recovery_security server.test_provider_audit_remote_anchor_conformance server.test_provider_audit_durable_anchor server.test_provider_audit_remote_anchor
