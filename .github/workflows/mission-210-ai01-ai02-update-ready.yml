name: M210 AI-01 AI-02 update readiness

on:
  push:
    branches: [fix/mission-210-rebased-on-m209-reconciled]
  pull_request:
    branches: [fix/mission-209-rebased-on-m208-head]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/mission-210-ai01-ai02-update-ready.yml"

permissions:
  contents: read

jobs:
  android-verify-and-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Verify APK and write provenance
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee app-debug-signature.txt
          sha256sum "$APK" | tee app-debug.apk.sha256
          printf 'APPLICATION_ID=com.vidiftmax.aibridgebrowser\nVERSION_NAME=0.1.0\nVERSION_CODE=1\nBUILD_TYPE=debug\nRELEASE_CHANNEL=NOT_FOR_IN_APP_UPDATER\n' > app-debug-provenance.txt
      - name: Upload debug APK and verification record
        uses: actions/upload-artifact@v4
        with:
          name: ai-bridge-browser-m210-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug-signature.txt
            app-debug.apk.sha256
            app-debug-provenance.txt
          if-no-files-found: error
