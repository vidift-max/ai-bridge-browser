name: M210 AI-01 AI-02 update readiness

on:
  push:
    branches: [feat/mission-210-ai01-ai02-update-ready]
  pull_request:
    branches: [feat/mission-209-ai01-ai02-proof-ui]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/mission-210-ai01-ai02-update-ready.yml"

permissions:
  contents: read

jobs:
  android-verify-and-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-bridge-browser-m210-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
