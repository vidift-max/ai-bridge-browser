name: Mission 74 Firebase First Contact Runner
on:
  push:
    branches: ["feat/mission-74-firebase-first-contact-runner"]
  pull_request:
    branches: ["feat/mission-73-first-text-audio-test"]
permissions:
  contents: read
jobs:
  python-runner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate first-contact runner without external credentials
        run: python -m unittest server.test_firebase_first_contact_smoke -v
