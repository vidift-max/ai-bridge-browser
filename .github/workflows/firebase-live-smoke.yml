name: Firebase live smoke verification — AI Messenger

on:
  workflow_dispatch:
    inputs:
      confirm_verify:
        description: Type VERIFY_AI_MESSENGER to authorize read-only live checks.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-messenger-firebase-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify published Firebase endpoints
    if: ${{ inputs.confirm_verify == 'VERIFY_AI_MESSENGER' && github.ref == 'refs/heads/feat/mission-181-firebase-project-bootstrap' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Hosting routes and public database denial
        run: node scripts/verify-firebase-live.mjs
