name: Mission 148 Replay Reservation Fencing CI

on:
  push:
    branches:
      - feat/mission-148-replay-reservation-fencing
  pull_request:
    branches:
      - feat/mission-147-provider-retry-recovery
    paths:
      - "server/ai_provider_host.py"
      - "server/test_ai_provider_host.py"
      - ".github/workflows/mission-148-replay-reservation-fencing.yml"

jobs:
  replay-reservation-fencing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_ai_provider_host server.test_provider_request_store server.test_provider_host_messenger_http server.test_ai_provider_host_contract_spec server.test_http_server server.test_messenger_backend server.test_agent_provider_registry
