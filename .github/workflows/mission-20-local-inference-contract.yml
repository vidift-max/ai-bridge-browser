name: Mission 20 Local Inference Contract

on:
  push:
    branches:
      - feat/mission-20-local-inference-contract
    paths:
      - 'server/**'
      - 'docs/MISSION_20_LOCAL_INFERENCE_CONTRACT.md'
      - '.github/workflows/mission-20-local-inference-contract.yml'
  pull_request:
    branches:
      - feat/mission-19-observability-recovery
    paths:
      - 'server/**'
      - 'docs/MISSION_20_LOCAL_INFERENCE_CONTRACT.md'
      - '.github/workflows/mission-20-local-inference-contract.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete backend test suite
        run: python -m unittest discover -s server -p 'test_*.py' -v

  android-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
