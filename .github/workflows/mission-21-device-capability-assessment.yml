name: Mission 21 Device Capability Assessment

on:
  push:
    branches:
      - feat/mission-21-device-capability-assessment
    paths:
      - 'web/local-ai-capability.js'
      - 'web/local-ai-capability.test.mjs'
      - 'web/rooms.html'
      - 'server/test_local_ai_capability.py'
      - 'docs/MISSION_21_DEVICE_CAPABILITY_ASSESSMENT.md'
      - '.github/workflows/mission-21-device-capability-assessment.yml'
  pull_request:
    branches:
      - feat/mission-20-local-inference-contract
    paths:
      - 'web/local-ai-capability.js'
      - 'web/local-ai-capability.test.mjs'
      - 'web/rooms.html'
      - 'server/test_local_ai_capability.py'
      - 'docs/MISSION_21_DEVICE_CAPABILITY_ASSESSMENT.md'
      - '.github/workflows/mission-21-device-capability-assessment.yml'

permissions:
  contents: read

jobs:
  browser-capability-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mocked browser capability tests
        run: node --test web/local-ai-capability.test.mjs

  backend-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete backend test suite
        run: python -m unittest discover -s server -p 'test_*.py' -v

  android-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
