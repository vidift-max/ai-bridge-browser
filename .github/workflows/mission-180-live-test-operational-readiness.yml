name: Mission 180 Live-Test Operational Readiness

on:
  pull_request:
    branches:
      - feat/mission-179-two-agent-roundtrip-proof
    paths:
      - "server/live_test_preflight.py"
      - "server/agent_provider_router.py"
      - "server/test_live_test_preflight.py"
      - "server/test_agent_provider_router.py"
      - "docs/MISSION_180_LIVE_TEST_OPERATIONAL_READINESS.md"
      - ".github/workflows/mission-180-live-test-operational-readiness.yml"
  push:
    branches:
      - feat/mission-180-live-test-operational-readiness

jobs:
  offline-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_live_test_preflight server.test_agent_provider_router server.test_provider_registry server.test_ai_provider_host server.test_provider_host_messenger_http server.test_http_server server.test_messenger_backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/ai-conversation-host-client.test.mjs web/ai-conversation-panel.test.mjs web/ai-conversation-runtime.test.mjs
