name: Mission 146 Provider Replay Guard CI

on:
  push:
    branches:
      - feat/mission-146-provider-replay-guard-hardening
  pull_request:
    branches:
      - feat/mission-145-ci-hardening-provider-recovery
    paths:
      - "server/ai_provider_host.py"
      - "server/test_ai_provider_host.py"
      - ".github/workflows/mission-146-provider-replay-guard.yml"

jobs:
  provider-replay-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_ai_provider_host server.test_provider_request_store server.test_provider_host_messenger_http server.test_ai_provider_host_contract_spec server.test_http_server server.test_messenger_backend server.test_agent_provider_registry
