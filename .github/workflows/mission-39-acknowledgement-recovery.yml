name: Mission 39 Acknowledgement Recovery
on:
  pull_request:
    branches: ["feat/mission-38-acknowledgement-recovery", "feat/mission-38-backend-long-poll-argument-guard"]
  push:
    branches: ["feat/mission-39-acknowledgement-recovery"]
permissions:
  contents: read
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/*.test.mjs
  backend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s server -p 'test_*.py' -v
  android-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest :app:assembleDebug
          else
            echo "Android Gradle project not present; validation unavailable"
            exit 1
          fi
