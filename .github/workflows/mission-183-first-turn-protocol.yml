name: Mission 183 First Turn Protocol

on:
  pull_request:
    branches:
      - feat/mission-182-staging-execution-evidence
  push:
    branches:
      - feat/mission-183-first-turn-protocol-contract

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_live_test_execution_evidence server.test_controlled_live_test_gate server.test_live_test_preflight server.test_agent_provider_router
