name: Firebase config validation

on:
  pull_request:
    paths:
      - "firebase/**"
      - "scripts/validate-firebase-project.mjs"
      - "scripts/verify-firebase-live.mjs"
      - "scripts/validate-firebase-wif-config.mjs"
      - "tests/**"
      - ".github/workflows/firebase-ai-messenger-deploy.yml"
      - ".github/workflows/firebase-live-smoke.yml"
      - ".github/workflows/firebase-wif-readiness.yml"
      - ".github/workflows/firebase-config-validation.yml"
  push:
    branches:
      - "feat/mission-181-firebase-project-bootstrap"
      - "test/mission-182-firebase-preflight-hardening"
      - "security/mission-183-firebase-deploy-guardrails"
      - "test/mission-184-firebase-live-smoke-verification"
      - "test/mission-185-firebase-wif-readiness"
    paths:
      - "firebase/**"
      - "scripts/validate-firebase-project.mjs"
      - "scripts/verify-firebase-live.mjs"
      - "scripts/validate-firebase-wif-config.mjs"
      - "tests/**"
      - ".github/workflows/firebase-ai-messenger-deploy.yml"
      - ".github/workflows/firebase-live-smoke.yml"
      - ".github/workflows/firebase-wif-readiness.yml"
      - ".github/workflows/firebase-config-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Firebase project files
        run: node scripts/validate-firebase-project.mjs
      - name: Run Firebase preflight regression tests
        run: node --test tests/firebase-project-validator.test.mjs
      - name: Run Firebase deployment workflow guardrail tests
        run: node --test tests/firebase-deploy-workflow.test.mjs
      - name: Run Firebase live smoke verifier tests
        run: node --test tests/firebase-live-smoke.test.mjs
      - name: Run Firebase live smoke workflow guardrail tests
        run: node --test tests/firebase-live-smoke-workflow.test.mjs
      - name: Run Firebase WIF configuration tests
        run: node --test tests/firebase-wif-config.test.mjs
      - name: Run Firebase WIF readiness workflow tests
        run: node --test tests/firebase-wif-readiness-workflow.test.mjs
