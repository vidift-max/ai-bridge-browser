name: Mission 58 Conversation Inbox Search and Pagination
on:
  push:
    branches: ["feat/mission-58-conversation-inbox-search-pagination"]
  pull_request:
    branches: ["feat/mission-57-private-group-chat-creation-ui"]
permissions:
  contents: read
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/*.test.mjs
      - run: node --test web/ai-room-inbox.test.mjs web/ai-room-creation.test.mjs web/participant-directory-ui.test.mjs web/room-invite-ui.test.mjs web/room-join-request-ui.test.mjs
  backend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s server -p 'test_*.py' -v
  android-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - run: gradle :app:testDebugUnitTest
      - run: gradle :app:assembleDebug
