name: Mission 166 Provider Audit Loopback Server Factory CI

on:
  push:
    branches:
      - feat/mission-166-provider-audit-loopback-server-factory
  pull_request:
    branches:
      - feat/mission-165-provider-audit-http-transport-adapter
    paths:
      - "server/provider_audit_http_transport.py"
      - "server/provider_audit_http_server.py"
      - "server/test_provider_audit_http_transport.py"
      - "server/test_provider_audit_http_server_factory.py"
      - "server/provider_audit_remote_service.py"
      - "server/provider_audit_durable_anchor.py"
      - "server/provider_audit_remote_anchor.py"
      - "server/provider_audit_checkpoint.py"
      - ".github/workflows/mission-166-provider-audit-loopback-server-factory.yml"
      - "docs/MISSION_166_PROVIDER_AUDIT_LOOPBACK_SERVER_FACTORY.md"

jobs:
  provider-audit-loopback-server-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_provider_audit_http_server_factory server.test_provider_audit_http_transport server.test_provider_audit_remote_service server.test_provider_audit_durable_anchor server.test_provider_audit_remote_anchor server.test_provider_audit_external_checkpoint server.test_provider_audit_chain_integrity server.test_provider_lease_audit_trail server.test_provider_request_store server.test_provider_lease_multiprocess_recovery
