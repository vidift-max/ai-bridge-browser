name: M209 AI bridge proof UI verification

on:
  push:
    branches: [feat/mission-209-ai01-ai02-proof-ui]
  pull_request:
    branches: [feat/mission-208-ai01-ai02-physical-evidence]
    paths:
      - "app/src/main/java/**"
      - "app/src/test/java/**"
      - "docs/MISSION_209_AI01_AI02_PROOF_UI.md"
      - ".github/workflows/mission-209-ai01-ai02-proof-ui.yml"

jobs:
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug
