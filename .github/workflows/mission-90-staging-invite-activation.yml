name: Mission 90 Staging Invite Activation

on:
  push:
    branches: ["feat/mission-90-staging-invite-activation", "feat/mission-93-safe-autodeploy-boundary", "feat/mission-94-harden-staging-verifier", "feat/mission-95-fix-pr-ci-trigger", "feat/mission-96-verifier-response-hardening", "feat/mission-97-fix-android-ci-checkout", "feat/mission-99-ai01-ai02-message-audit", "feat/mission-100-free-ephemeral-staging-gate", "feat/mission-101-first-contact-runner", "feat/mission-102-ack-proof-hardening", "feat/mission-103-exact-sequence-ack-proof", "feat/mission-104-use-real-pending-route", "feat/mission-105-fix-sequence-regression", "feat/mission-106-ack-before-pending-proof", "feat/mission-107-first-contact-preflight", "feat/mission-108-first-contact-correlation-hardening", "feat/mission-109-runner-input-boundary", "feat/mission-110-first-contact-execution-safety", "feat/mission-111-first-contact-idempotency", "feat/mission-112-first-contact-timeout-recovery", "feat/mission-113-first-contact-e2e-preparation", "feat/mission-114-staging-authorization-gate", "feat/mission-115-final-preflight-checklist", "feat/mission-116-bound-authorization", "feat/mission-117-operator-readiness-audit", "feat/mission-118-runtime-contract-verification"]
  pull_request:
    branches: ["feat/mission-90-staging-invite-activation", "feat/mission-93-safe-autodeploy-boundary", "feat/mission-94-harden-staging-verifier", "feat/mission-95-fix-pr-ci-trigger", "feat/mission-96-verifier-response-hardening", "feat/mission-97-fix-android-ci-checkout", "feat/mission-99-ai01-ai02-message-audit", "feat/mission-100-free-ephemeral-staging-gate", "feat/mission-101-first-contact-runner", "feat/mission-102-ack-proof-hardening", "feat/mission-103-exact-sequence-ack-proof", "feat/mission-104-use-real-pending-route", "feat/mission-105-fix-sequence-regression", "feat/mission-106-ack-before-pending-proof", "feat/mission-107-first-contact-preflight", "feat/mission-108-first-contact-correlation-hardening", "feat/mission-109-runner-input-boundary", "feat/mission-110-first-contact-execution-safety", "feat/mission-111-first-contact-idempotency", "feat/mission-112-first-contact-timeout-recovery", "feat/mission-113-first-contact-e2e-preparation", "feat/mission-114-staging-authorization-gate", "feat/mission-115-final-preflight-checklist", "feat/mission-116-bound-authorization", "feat/mission-117-operator-readiness-audit", "feat/mission-118-runtime-contract-verification"]

permissions:
  contents: read

jobs:
  backend-invite-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest server.test_messenger_backend server.test_staging_activation_contract server.test_m91_render_staging_boundary server.test_http_e2e server.test_staging_http_verifier server.test_mission_97_android_checkout server.test_mission_99_message_contract server.test_mission_101_first_contact_runner server.test_mission_107_first_contact_preflight server.test_mission_108_first_contact_correlation server.test_mission_110_execution_safety server.test_mission_111_idempotency server.test_mission_112_timeout_recovery server.test_mission_113_e2e_contract server.test_mission_114_authorization_gate server.test_mission_115_final_preflight server.test_mission_116_bound_authorization server.test_mission_117_operator_readiness server.test_mission_118_runtime_contract server.test_runtime_config -v
      - run: python -m py_compile scripts/verify_staging_http.py scripts/verify_first_contact.py scripts/verify_first_contact_config.py scripts/verify_first_contact_authorization.py scripts/verify_first_contact_preflight.py scripts/verify_first_contact_authorization.py scripts/verify_staging_operator_readiness.py server/http_server.py server/runtime_config.py server/operational_runtime.py server/recovery.py server/sqlite_store.py server/messenger_backend.py

  browser-invite-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/room-invite-ui.test.mjs web/room-join-request-ui.test.mjs

  android-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - run: gradle :app:testDebugUnitTest

  activation-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert staging blueprint is isolated and manually deployed
        run: |
          grep -q 'name: ai-bridge-browser-staging' render.staging.yaml
          grep -q 'plan: free' render.staging.yaml
          grep -q 'value: ephemeral' render.staging.yaml
          grep -q 'key: MESSENGER_ENVIRONMENT' render.staging.yaml
          grep -q 'value: staging' render.staging.yaml
          grep -q 'key: MESSENGER_ALLOW_EPHEMERAL_STAGING' render.staging.yaml
          grep -q "value: 'true'" render.staging.yaml
          grep -q "value: ':memory:'" render.staging.yaml
          grep -q 'autoDeployTrigger: off' render.staging.yaml
          ! grep -qi 'token-a\|token-b' render.staging.yaml
