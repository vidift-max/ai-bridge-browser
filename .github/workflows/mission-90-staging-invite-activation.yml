name: Mission 90 Staging Invite Activation

on:
  push:
    branches: ["feat/mission-91-render-staging-plan", "feat/mission-92-staging-preflight", "feat/mission-93-safe-autodeploy-boundary", "feat/mission-94-harden-staging-verifier", "feat/mission-95-fix-pr-ci-trigger", "feat/mission-96-verifier-response-hardening", "feat/mission-97-fix-android-ci-checkout"]
  pull_request:
    branches: ["feat/mission-90-staging-invite-activation", "feat/mission-93-safe-autodeploy-boundary", "feat/mission-94-harden-staging-verifier", "feat/mission-95-fix-pr-ci-trigger", "feat/mission-96-verifier-response-hardening", "feat/mission-97-fix-android-ci-checkout"]

permissions:
  contents: read

jobs:
  backend-invite-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest server.test_staging_activation_contract server.test_m91_render_staging_boundary server.test_http_e2e server.test_staging_http_verifier server.test_mission_97_android_checkout -v
      - run: python -m py_compile scripts/verify_staging_http.py

  browser-invite-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/room-invite-ui.test.mjs web/room-join-request-ui.test.mjs

  android-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - run: gradle :app:testDebugUnitTest

  activation-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert staging blueprint is isolated and manually deployed
        run: |
          grep -q 'name: ai-bridge-browser-staging' render.staging.yaml
          grep -q 'plan: free' render.staging.yaml
          grep -q 'value: ephemeral' render.staging.yaml
          grep -q "value: ':memory:'" render.staging.yaml
          grep -q 'autoDeployTrigger: off' render.staging.yaml
          ! grep -qi 'token-a\|token-b' render.staging.yaml
