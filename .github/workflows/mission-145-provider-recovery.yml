name: Mission 145 Provider Recovery CI

on:
  push:
    branches:
      - feat/mission-145-ci-hardening-provider-recovery
  pull_request:
    branches:
      - feat/mission-144-attestation-verification
    paths:
      - "server/ai_provider_host.py"
      - "server/sqlite_store.py"
      - "server/test_ai_provider_host.py"
      - "server/test_provider_request_store.py"
      - "server/test_provider_host_messenger_http.py"
      - ".github/workflows/mission-145-provider-recovery.yml"

jobs:
  provider-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_provider_request_store server.test_provider_host_messenger_http server.test_ai_provider_host server.test_ai_provider_host_contract_spec server.test_http_server server.test_messenger_backend server.test_agent_provider_registry
