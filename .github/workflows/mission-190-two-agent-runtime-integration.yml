name: Mission 190 Two-Agent Runtime Integration

on:
  pull_request:
    branches:
      - feat/mission-189-staging-verification-adapter
    paths:
      - "server/two_agent_runtime.py"
      - "server/test_two_agent_runtime.py"
      - "server/http_server.py"
      - "server/ai_conversation_host.py"
      - "server/agent_provider_router.py"
      - "server/provider_adapters.py"
      - "server/test_provider_host_messenger_http.py"
      - "server/test_ai_conversation_host.py"
      - "web/ai-conversation-host-client.js"
      - "web/ai-conversation-host-client.test.mjs"
      - "web/ai-conversation-panel.js"
      - "web/ai-conversation-panel.test.mjs"
      - "web/ai-conversation-runtime.test.mjs"
      - ".github/workflows/mission-190-two-agent-runtime-integration.yml"
  push:
    branches:
      - feat/mission-190-two-agent-runtime-integration

jobs:
  two-agent-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_two_agent_runtime server.test_ai_conversation_host server.test_provider_host_messenger_http server.test_agent_provider_router server.test_provider_registry server.test_ai_provider_host server.test_http_server server.test_messenger_backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/ai-conversation-host-client.test.mjs web/ai-conversation-panel.test.mjs web/ai-conversation-runtime.test.mjs
