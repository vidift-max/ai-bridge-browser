name: Mission 52 Authorized Multi-AI Messaging
on:
  push:
    branches: ["feat/mission-52-authorized-multi-ai-messaging"]
  pull_request:
    branches: ["feat/mission-51-multi-ai-room-admission"]
permissions:
  contents: read
jobs:
  backend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s server -p 'test_*.py' -v
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/*.test.mjs
      - run: node --test web/ai-provider-handshake.test.mjs
      - run: node --test web/ai-session-adapter.test.mjs
      - run: node --test web/ai-room-admission.test.mjs
      - run: node --test web/ai-room-messenger.test.mjs
  android-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - uses: actions/checkout@v4
      - run: gradle :app:testDebugUnitTest
      - run: gradle :app:assembleDebug
