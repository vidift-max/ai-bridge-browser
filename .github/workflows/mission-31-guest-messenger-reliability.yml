name: Mission 31 Guest Messenger Reliability
on:
  push:
    branches: [feat/mission-31-guest-messenger-reliability]
    paths:
      - 'web/guest-room.js'
      - 'web/guest-room.test.mjs'
      - 'web/guest.html'
      - 'docs/MISSION_31_GUEST_MESSENGER_RELIABILITY.md'
      - '.github/workflows/mission-31-guest-messenger-reliability.yml'
  pull_request:
    paths:
      - 'web/guest-room.js'
      - 'web/guest-room.test.mjs'
      - 'web/guest.html'
      - 'docs/MISSION_31_GUEST_MESSENGER_RELIABILITY.md'
      - '.github/workflows/mission-31-guest-messenger-reliability.yml'
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/guest-room.test.mjs
      - run: node --test web/*.test.mjs
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s server -p 'test_*.py' -v
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - run: gradle :app:testDebugUnitTest
      - run: gradle :app:assembleDebug
