name: Mission 170 Provider Audit Authentication Failure Contract

on:
  push:
    branches:
      - feat/mission-170-provider-audit-auth-failure-contract
  pull_request:
    branches:
      - feat/mission-169-provider-audit-activation-gate
    paths:
      - "server/provider_audit_remote_service.py"
      - "server/test_provider_audit_remote_service.py"
      - "server/test_provider_audit_messenger_activation.py"
      - "server/test_provider_audit_messenger_http_integration.py"
      - "server/test_provider_audit_http_server_factory.py"
      - "server/test_provider_audit_http_transport.py"
      - "server/test_provider_audit_durable_anchor.py"
      - ".github/workflows/mission-170-provider-audit-auth-failure-contract.yml"
      - "docs/MISSION_170_PROVIDER_AUDIT_AUTH_FAILURE_CONTRACT.md"

jobs:
  provider-audit-auth-failure-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_provider_audit_remote_service server.test_provider_audit_messenger_activation server.test_provider_audit_messenger_http_integration server.test_provider_audit_http_server_factory server.test_provider_audit_http_transport server.test_provider_audit_durable_anchor
