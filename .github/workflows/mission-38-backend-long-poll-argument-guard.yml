name: Mission 38 Backend Long-Poll Argument Guard
on:
  push:
    branches: [feat/mission-38-backend-long-poll-argument-guard]
    paths:
      - 'server/messenger_backend.py'
      - 'server/test_messenger_backend.py'
      - 'docs/MISSION_38_BACKEND_LONG_POLL_ARGUMENT_GUARD.md'
      - '.github/workflows/mission-38-backend-long-poll-argument-guard.yml'
  pull_request:
    paths:
      - 'server/messenger_backend.py'
      - 'server/test_messenger_backend.py'
      - 'docs/MISSION_38_BACKEND_LONG_POLL_ARGUMENT_GUARD.md'
      - '.github/workflows/mission-38-backend-long-poll-argument-guard.yml'
permissions:
  contents: read
jobs:
  backend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest server.test_messenger_backend -v
      - run: python -m unittest discover -s server -p 'test_*.py' -v
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/*.test.mjs
  android-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: actions/checkout@v4
      - run: gradle :app:testDebugUnitTest
      - run: gradle :app:assembleDebug
