name: M208 AI bridge physical-evidence readiness

on:
  push:
    branches: [feat/mission-208-ai01-ai02-physical-evidence]
  pull_request:
    branches: [feat/mission-207-ai01-ai02-roundtrip-proof]
    paths:
      - "app/src/main/java/**"
      - "app/src/test/java/**"
      - "docs/MISSION_208_AI01_AI02_PHYSICAL_EVIDENCE.md"
      - ".github/workflows/mission-208-ai01-ai02-physical-evidence.yml"

jobs:
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug
