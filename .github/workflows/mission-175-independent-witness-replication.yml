name: Mission 175 Independent Witness Replication

on:
  push:
    branches:
      - feat/mission-175-independent-witness-replication
  pull_request:
    branches:
      - feat/mission-174-trusted-head-backup-restore
    paths:
      - "server/provider_audit_trusted_witness.py"
      - "server/test_provider_audit_trusted_witness.py"
      - "server/provider_audit_trusted_head_backup.py"
      - "server/test_provider_audit_trusted_head_backup.py"
      - ".github/workflows/mission-175-independent-witness-replication.yml"
      - "docs/MISSION_175_INDEPENDENT_WITNESS_REPLICATION.md"

jobs:
  independent-witness-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_provider_audit_trusted_witness server.test_provider_audit_trusted_head_backup server.test_provider_audit_remote_anchor_conformance server.test_provider_audit_anchor_protocol server.test_provider_audit_remote_anchor server.test_provider_audit_durable_anchor server.test_provider_audit_remote_service server.test_provider_audit_messenger_activation server.test_provider_audit_messenger_http_integration server.test_provider_audit_http_server_factory server.test_provider_audit_http_transport
