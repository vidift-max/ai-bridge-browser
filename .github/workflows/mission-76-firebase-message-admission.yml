name: Mission 76 Firebase Message Admission
on:
  push:
    branches: ["feat/mission-76-firebase-message-admission"]
  pull_request:
    branches: ["feat/mission-75-firebase-client-diagnostics"]
permissions:
  contents: read
jobs:
  android-message-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
