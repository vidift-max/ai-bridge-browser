name: Mission 142 Provider Host Messenger Integration
on:
  pull_request:
    branches:
      - feat/mission-141-authenticated-provider-host
    paths:
      - "server/ai_provider_host.py"
      - "server/http_server.py"
      - "server/test_provider_host_messenger_http.py"
      - "server/test_http_server.py"
      - "server/test_ai_provider_host.py"
      - "server/test_messenger_backend.py"
      - "docs/MISSION_142_PROVIDER_HOST_MESSENGER_INTEGRATION.md"
      - ".github/workflows/mission-142-provider-host-messenger-integration.yml"
  push:
    branches:
      - feat/mission-142-provider-host-messenger-integration
jobs:
  authenticated-provider-messenger-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest server.test_ai_provider_host server.test_ai_provider_host_contract_spec server.test_provider_host_messenger_http server.test_http_server server.test_messenger_backend
