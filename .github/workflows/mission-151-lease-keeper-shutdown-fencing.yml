name: Mission 151 Lease Keeper Shutdown Fencing CI
# Final validation includes schema migration, lease reclaim, and stale-generation regression tests.

on:
  push:
    branches:
      - feat/mission-151-lease-keeper-shutdown-fencing
  pull_request:
    branches:
      - feat/mission-149-durable-provider-claim-fencing
    paths:
      - "server/sqlite_store.py"
      - "server/messenger_backend.py"
      - "server/http_server.py"
      - "server/test_provider_request_store.py"
      - "server/test_provider_host_messenger_http.py"
      - "server/provider_request_lease.py"
      - ".github/workflows/mission-151-lease-keeper-shutdown-fencing.yml"
      - ".github/workflows/mission-151-lease-keeper-shutdown-fencing.yml"

jobs:
  provider-lease-heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server
      - run: python -m unittest server.test_ai_provider_host server.test_provider_request_store server.test_provider_host_messenger_http server.test_ai_provider_host_contract_spec server.test_http_server server.test_messenger_backend server.test_agent_provider_registry
