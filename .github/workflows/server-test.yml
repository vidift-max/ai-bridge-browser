name: Messenger Backend Test

on:
  push:
    branches: [v2-saas-alpha, feat/mission-08-identity-validation, feat/mission-09-room-voice-controls, feat/mission-10-webrtc-private-calls-v2, feat/mission-26-public-guest-intake, feat/mission-27-guest-credential-provisioning, feat/mission-28-guest-web-session-lifecycle]
    paths:
      - 'server/**'
      - 'docs/MISSION_27_GUEST_CREDENTIAL_PROVISIONING.md'
      - 'docs/MISSION_28_GUEST_WEB_SESSION_LIFECYCLE.md'
      - 'render.yaml'
      - '.github/workflows/server-test.yml'
      - 'docs/AI_MESSENGER_MISSION_06_**'
  pull_request:
    branches: [v2-saas-alpha, feat/mission-08-identity-validation, feat/mission-09-room-voice-controls, feat/mission-26-public-guest-intake, feat/mission-27-guest-credential-provisioning]
    paths:
      - 'server/**'
      - 'docs/MISSION_28_GUEST_WEB_SESSION_LIFECYCLE.md'
      - 'docs/MISSION_27_GUEST_CREDENTIAL_PROVISIONING.md'
      - '.github/workflows/server-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run backend unit tests
        run: python -m unittest discover -s server -p 'test_*.py' -v
