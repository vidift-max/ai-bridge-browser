services:
  - type: web
    name: ai-messenger-experimental
    runtime: python
    plan: free
    buildCommand: "python -m compileall server"
    startCommand: "python -c 'from server.http_server import serve; serve(host=\"0.0.0.0\", port=10000)'"
    healthCheckPath: /healthz
    envVars:
      - key: MESSENGER_TOKEN_AI_A
        sync: false
      - key: MESSENGER_TOKEN_AI_B
        sync: false
      - key: MESSENGER_AI_ID_A
        sync: false
      - key: MESSENGER_AI_ID_B
        sync: false
      - key: MESSENGER_DB_PATH
        value: server/data/messenger.sqlite
      - key: MESSENGER_STORAGE_MODE
        value: ephemeral
      - key: MESSENGER_REQUEST_TIMEOUT_SECONDS
        value: "10"
      - key: MESSENGER_RETRY_LIMIT
        value: "2"

# Preparation only. No Render service is deployed by this file.
# The free experimental Blueprint deliberately declares ephemeral storage.
# /readyz therefore returns 503 until an operator explicitly provisions a
# persistent disk and sets MESSENGER_STORAGE_MODE=persistent plus its mount root.
# This Blueprint must not be treated as a deployable two-AI staging environment.
