services:
  - type: web
    name: ai-messenger-experimental
    runtime: python
    plan: free
    buildCommand: "python -m compileall server"
    startCommand: "python -c 'import os; from server.http_server import serve; serve(host=\"0.0.0.0\", port=int(os.environ.get(\"PORT\", \"10000\")))'"
    healthCheckPath: /healthz
    envVars:
      - key: MESSENGER_TOKEN_AI_A
        sync: false
      - key: MESSENGER_TOKEN_AI_B
        sync: false
      - key: MESSENGER_AI_ID_A
        sync: false
      - key: MESSENGER_AI_ID_B
        sync: false
      - key: MESSENGER_DB_PATH
        value: server/data/messenger.sqlite
      - key: MESSENGER_STORAGE_MODE
        value: ephemeral
      - key: MESSENGER_REQUEST_TIMEOUT_SECONDS
        value: "10"
      - key: MESSENGER_RETRY_LIMIT
        value: "2"

# Experimental deployment configuration for the first authenticated text-contact test.
# Free Render storage is ephemeral: SQLite/messages/audio can be lost on restart,
# redeploy or spin-down. This is acceptable only for the first live connectivity
# proof; durable production storage remains a separate gate.
# /readyz intentionally remains a durability gate and may return 503 in ephemeral mode.
